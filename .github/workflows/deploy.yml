name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
      ALLOWED_IDS: ${{ secrets.ALLOWED_IDS }}
      WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Test
        run: |
          npm test
          npm run check

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            D1_DATABASE_ID
            TELEGRAM_BOT_TOKEN
            ADMIN_IDS
            ALLOWED_IDS
            WEBAPP_URL
            WEBHOOK_SECRET
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Configure D1 database id
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path("wrangler.toml")
          text = p.read_text()
          text = text.replace(
              'database_id = "00000000-0000-0000-0000-000000000000"',
              f'database_id = "{os.environ["D1_DATABASE_ID"]}"'
          )
          p.write_text(text)
          PY

      - name: Apply D1 schema
        run: npx wrangler d1 execute avansbot-db --remote --file=./schema.sql

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Upload Worker secrets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const keys = [
            'TELEGRAM_BOT_TOKEN',
            'ADMIN_IDS',
            'ALLOWED_IDS',
            'WEBAPP_URL',
            'WEBHOOK_SECRET'
          ];
          const obj = Object.fromEntries(keys.map(k => [k, process.env[k]]));
          fs.writeFileSync('.worker-secrets.json', JSON.stringify(obj));
          NODE
          npx wrangler secret bulk .worker-secrets.json
          rm -f .worker-secrets.json

      - name: Configure Telegram webhook
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          base = os.environ["WEBAPP_URL"].rstrip("/")
          secret = os.environ["WEBHOOK_SECRET"]
          url = f"https://api.telegram.org/bot{token}/setWebhook"
          payload = json.dumps({
              "url": f"{base}/telegram/webhook",
              "secret_token": secret,
              "allowed_updates": ["message"]
          }).encode()
          req = urllib.request.Request(url, data=payload, headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req) as r:
              data = json.load(r)
          if not data.get("ok"):
              raise SystemExit(f"Telegram setWebhook failed: {data}")
          print("Telegram webhook configured")
          PY
